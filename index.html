<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cotizador ANDMAX Laser</title>
</head>
<body>

    <h2>Cotizador de Corte Láser</h2>
    
    <form id="cotizadorForm">
        <!-- Archivo DXF -->
        <label for="file">Archivo DXF:</label><br>
        <input type="file" id="file" name="file" accept=".dxf" required><br><br>

        <!-- Selección de Material -->
        <label for="material">Material:</label><br>
        <select id="material" name="material" required>
            <option value="acero_carbono">Acero al Carbono / Hierro</option>
            <option value="acero_inoxidable">Acero Inoxidable</option>
            <option value="aluminio">Aluminio</option>
            <option value="mdf">MDF / Madera</option>
            <option value="acrilico">Acrílico</option>
        </select><br><br>

        <!-- Selección de Espesor -->
        <label for="espesor">Espesor (mm):</label><br>
        <select id="espesor" name="espesor" required>
            <option value="1">1 mm</option>
            <option value="2">2 mm</option>
            <option value="3" selected>3 mm</option>
            <option value="4">4 mm</option>
            <option value="5">5 mm</option>
            <option value="6">6 mm</option>
            <option value="8">8 mm</option>
            <option value="10">10 mm</option>
            <option value="12">12 mm</option>
        </select><br><br>

        <!-- Opción Incluye Material -->
        <label>
            <input type="checkbox" id="incluye_material" name="incluye_material" checked>
            Incluir provisión de material
        </label><br><br>

        <button type="submit" id="btnCotizar">Calcular Cotización</button>
    </form>

    <hr>

    <!-- Resultados -->
    <div id="resultado" style="display:none;">
        <h3>Resumen de Cotización</h3>
        <p><strong>Metros de corte:</strong> <span id="resMetros"></span> m</p>
        <p><strong>Piercings (Perforaciones):</strong> <span id="resPiercings"></span></p>
        <p><strong>Precio/metro aplicado:</strong> $<span id="resPrecioMetro"></span></p>
        <p><strong>Costo Mecanizado:</strong> $<span id="resMecanizado"></span></p>
        <p><strong>Costo Material:</strong> $<span id="resCostoMaterial"></span></p>
        <p><strong>Costo Setup:</strong> $<span id="resSetup"></span></p>
        <h4><strong>TOTAL ESTIMADO: $<span id="resTotal"></span></strong></h4>
        
        <button id="btnPagar">Pagar con Mercado Pago</button>
    </div>

    <script>
        const API_URL = "https://andmax-cotizador-api.onrender.com";
        let datosUltimaCotizacion = null;

        document.getElementById("cotizadorForm").addEventListener("submit", async function(e) {
            e.preventDefault();

            const fileInput = document.getElementById("file");
            if (!fileInput.files[0]) {
                alert("Por favor selecciona un archivo .DXF");
                return;
            }

            // Crear el objeto FormData con los nombres exactos que espera FastAPI
            const formData = new FormData();
            formData.append("file", fileInput.files[0]);
            formData.append("material", document.getElementById("material").value);
            formData.append("espesor", document.getElementById("espesor").value);
            formData.append("incluye_material", document.getElementById("incluye_material").checked);

            try {
                document.getElementById("btnCotizar").innerText = "Procesando DXF...";
                
                const response = await fetch(`${API_URL}/cotizar`, {
                    method: "POST",
                    body: formData // No setear Header 'Content-Type', el navegador asigna multipart/form-data automáticamente
                });

                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.detail || "Error al cotizar el archivo");
                }

                const data = await response.json();
                datosUltimaCotizacion = data;

                // Renderizar los valores devueltos por el backend
                document.getElementById("resMetros").innerText = data.metros_corte;
                document.getElementById("resPiercings").innerText = data.piercings;
                document.getElementById("resPrecioMetro").innerText = data.precio_metro_aplicado;
                document.getElementById("resMecanizado").innerText = data.costo_mecanizado;
                document.getElementById("resCostoMaterial").innerText = data.costo_material;
                document.getElementById("resSetup").innerText = data.costo_setup;
                document.getElementById("resTotal").innerText = data.total_estimado;

                document.getElementById("resultado").style.display = "block";

            } catch (error) {
                alert(`Error: ${error.message}`);
            } finally {
                document.getElementById("btnCotizar").innerText = "Calcular Cotización";
            }
        });

        // Botón para generar el link de Mercado Pago
        document.getElementById("btnPagar").addEventListener("click", async function() {
            if (!datosUltimaCotizacion) return;

            const pagoData = new FormData();
            pagoData.append("titulo", datosUltimaCotizacion.archivo);
            pagoData.append("monto", datosUltimaCotizacion.total_estimado);
            pagoData.append("material", datosUltimaCotizacion.material);
            pagoData.append("espesor", datosUltimaCotizacion.espesor);
            pagoData.append("metros", datosUltimaCotizacion.metros_corte);
            pagoData.append("piercings", datosUltimaCotizacion.piercings);
            pagoData.append("filepath", datosUltimaCotizacion.filepath);

            try {
                const response = await fetch(`${API_URL}/crear_pago`, {
                    method: "POST",
                    body: pagoData
                });

                const data = await response.json();
                if (data.init_point) {
                    window.location.href = data.init_point; // Redirige a Mercado Pago
                } else {
                    alert("No se pudo generar la preferencia de pago.");
                }
            } catch (err) {
                alert("Error al conectar con la pasarela de pago.");
            }
        });
    </script>
</body>
</html>
